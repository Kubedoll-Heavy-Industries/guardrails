[tool.uv.workspace]
members = ["src/*"]

[dependency-groups]
dev = [
  "ruff>=0.14.0",
  "numpy>=1.26.0",
  "pypdfium2>=4.30.0",
  "faiss-cpu>=1.8.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-mock>=3.14.0",
  "pytest-cov>=6.0.0",
  "pre-commit>=4.0.0",
  "pip>=24.0.0",
  "setuptools>=70.0.0",
  "ty>=0.0.0a5",
  "lxml-stubs>=0.5.1",
  "liccheck>=0.9.2",
  "twine>=6.0.0",
  "nox>=2024.10.9",
  "testcontainers>=4.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"  # minimum supported version
exclude = ["docs-graveyard", "docs"]

[tool.ruff.lint]
select = [
    # === Core Python Rules (Always Enable) ===
    "F",      # pyflakes: undefined vars, unused imports, invalid format strings
    "E",      # pycodestyle errors: PEP 8 violations
    "W",      # pycodestyle warnings: additional style issues
    # === Import Organization ===
    "I",      # isort: import sorting and organization
    # === Bug Prevention ===
    "B",      # flake8-bugbear: common Python gotchas and pitfalls
    "PLE",    # pylint errors: definite bugs
    "PLW",    # pylint warnings: likely bugs
    "RUF",    # ruff-specific rules: catch issues other linters miss
    # === Code Quality ===
    "C4",     # flake8-comprehensions: better list/dict/set comprehensions
    "SIM",    # flake8-simplify: simplification opportunities
    "PIE",    # flake8-pie: misc lints (no-op, prefer-unique-enum)
    # === Modern Python (3.12+) ===
    "UP",     # pyupgrade: modernize syntax for target Python version
    # === Performance ===
    "PERF",   # perflint: performance anti-patterns
    # === Security (Selective) ===
    "S102",   # exec-builtin: flag exec() usage
    "S103",   # bad-file-permissions: insecure file permissions
    "S108",   # hardcoded-temp-file: hardcoded /tmp paths
    "S110",   # try-except-pass: silent exception swallowing
    "S301",   # suspicious-pickle-usage: pickle deserialization
    "S307",   # suspicious-eval-usage: eval() usage
    "S608",   # hardcoded-sql-expression: SQL injection risk
]
ignore = [
    # =======================================================================
    # Formatter handles these
    # =======================================================================
    "E501",   # line too long

    # =======================================================================
    # Intentional patterns (no action needed)
    # =======================================================================
    "E731",   # lambda assignment - valid Python pattern
    "B008",   # function call in default argument - FastAPI Depends() pattern
    "B027",   # empty abstract method - intentional for protocols/interfaces
    "PLW0602", # global without assignment - intentional for module-level state
    "PLW0603", # global-statement - intentional for module-level state
    "PLW1641", # object without __hash__ - intentional for mutable dataclasses
    "PERF203", # try-except in loop - required for iterator consumption patterns
    "RUF009", # function call in dataclass defaults - pydantic Field() is fine

    # =======================================================================
    # Style preferences (subjective, keep current style)
    # =======================================================================
    "C400",   # unnecessary generator - readability preference
    "C405",   # unnecessary list in set() - readability preference
    "C408",   # unnecessary dict() call - readability preference
    "C411",   # unnecessary list() call - readability preference
    "C416",   # unnecessary list comprehension - readability preference
    "PERF102", # use dict.values() - keys sometimes useful for debugging
    "PERF401", # use list comprehension - readability preference
    "PERF402", # use list.copy - readability preference
    "PERF403", # use dict comprehension - readability preference
    "RUF005", # list concatenation vs unpacking - style preference
    "SIM101", # merge isinstance calls - can hurt readability
    "SIM102", # nested if statements - can hurt readability
    "SIM108", # use ternary operator - can hurt readability

    # =======================================================================
    # Python 3.10 compatibility (minimum supported version)
    # =======================================================================
    "UP007",  # Use X | Y for Union - requires 3.10+ in runtime contexts
    "UP035",  # deprecated typing imports - need typing.Optional for 3.9 compat
    "UP045",  # X | None vs Optional - requires 3.10+ in runtime contexts
    "UP046",  # PEP 695 type params - requires 3.12+

    # =======================================================================
    # TODO(@cagyirey, 5): Real bugs - fix in fast follow
    # =======================================================================
    "B006",   # mutable default argument - 14 violations, causes shared state bugs
    "RUF012", # mutable class attributes - 10 violations, causes shared state bugs

    # =======================================================================
    # TODO(@cagyirey, 4): Best practices - fix when touching affected code
    # =======================================================================
    "B904",   # raise from err - 47 violations, loses exception context
    "B028",   # no stacklevel in warnings - 20 violations, warnings point to wrong line
    "RUF013", # implicit Optional - 6 violations, type safety issue

    # =======================================================================
    # TODO(@cagyirey, 3): Minor improvements - fix opportunistically
    # =======================================================================
    "E741",   # ambiguous variable names (l, O, I) - few violations
    "B007",   # unused loop variable - should prefix with _
    "B017",   # assert blind exception - tests should be more specific
    "B026",   # star-arg unpacking after keyword - review for correctness
    "PLW2901", # redefined loop variable - 9 violations, review if intentional
    "RUF059", # unpacked variable never used - should prefix with _
    "SIM115", # context manager for open - review for resource leaks
    "SIM118", # use `key in dict` instead of `key in dict.keys()`
    "UP008",  # super() call style - modernize to super()
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501", "F811"]  # notebooks can redefine names
"tests/**" = [
    "B011",   # assert False allowed in tests
    "B018",   # useless expression (accessing properties to test they raise)
    "PLW0127", # self-assignment (test fixtures)
    "RUF001", # ambiguous characters in test data
    "RUF043", # regex patterns in pytest.raises
]
# SQL strings have intentional trailing whitespace for readability
"**/sqlite_trace_handler.py" = ["W291", "W293"]
"**/test_merge.py" = ["W291"]
"**/test_rail.py" = ["W291"]

[tool.ruff.lint.isort]
known-first-party = ["guardrails", "guardrails_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
  "no_hub_telemetry_mock: Skip hub telemetry mocking",
  "integration: Integration tests requiring Docker",
]
addopts = [
  "-v",
  "--strict-markers",
  "--tb=short",
  "-m", "not integration",
]

[tool.ty]

[tool.ty.rules]
invalid-method-override = "ignore"
missing-argument = "ignore"
unknown-argument = "ignore"
unresolved-attribute = "ignore"
unresolved-import = "warn"
invalid-argument-type = "warn"
invalid-return-type = "warn"
invalid-assignment = "warn"
invalid-type-form = "warn"
parameter-already-assigned = "warn"
invalid-context-manager = "warn"
possibly-missing-attribute = "warn"
invalid-parameter-default = "ignore"

[tool.ty.src]
include = ["src/guardrails/guardrails"]
exclude = [
  "src/guardrails/guardrails/utils/openai_utils/v1.py",
  "src/guardrails/guardrails/utils/sql_utils.py",
  "src/guardrails/guardrails/schema/**",
  "src/guardrails/guardrails/telemetry/**",
  "src/guardrails/guardrails/utils/docs_utils.py",
  "src/guardrails/guardrails/utils/misc.py",
  "src/guardrails/guardrails/vectordb/**",
  "src/guardrails/guardrails/guard.py",
  "src/guardrails/guardrails/llm_providers.py",
  "src/guardrails/guardrails/run/**",
  "src/guardrails/guardrails/integrations/**",
  "src/guardrails/guardrails/cli/**",
  "src/guardrails/guardrails/embedding.py",
  "src/guardrails/guardrails/formatters/**",
  "src/guardrails/guardrails/classes/validation/**",
  "src/guardrails/guardrails/classes/validation_outcome.py",
  "src/guardrails/guardrails/async_guard.py",
  "src/guardrails/guardrails/call_tracing/**",
]

[[tool.ty.overrides]]
include = ["src/guardrails/guardrails/vectordb/faiss.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"
invalid-method-override = "ignore"

[[tool.ty.overrides]]
include = [
  "src/guardrails/guardrails/validator_service/async_validator_service.py",
  "src/guardrails/guardrails/validator_service/sequential_validator_service.py",
]

[tool.ty.overrides.rules]
invalid-method-override = "ignore"

[[tool.ty.overrides]]
include = ["src/guardrails/guardrails/validator_base.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
no-matching-overload = "ignore"
possibly-missing-attribute = "ignore"
unresolved-attribute = "ignore"

[[tool.ty.overrides]]
include = ["src/guardrails/guardrails/utils/openai_utils/v1.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"

[[tool.ty.overrides]]
include = ["src/guardrails/guardrails/utils/sql_utils.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.coverage.run]
source = ["src/guardrails/guardrails"]
omit = [
  "*/tests/*",
  "*/test_*.py",
  "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.liccheck]
authorized_licenses = [
  "3-clause bsd",
  "bsd",
  "bsd3",
  "bsd-3-clause",
  "new bsd",
  "bsd license",
  "new bsd license",
  "simplified bsd",
  "academic free license (afl)",
  "apache",
  "apache 2.0",
  "apache-2.0",
  "apache license 2.0",
  "apache software",
  "apache software license",
  "apache-2.0 and cnri-python",
  "gnu lgpl",
  "lgpl with exceptions or zpl",
  "gnu library or lesser general public license (lgpl)",
  "isc",
  "isc license",
  "isc license (iscl)",
  "mit",
  "mit license",
  "mozilla public license 2.0 (mpl 2.0)",
  "the unlicense (unlicense)",
  "python software foundation",
  "python software foundation license",
  "psf-2.0",
  "zpl 2.1",
  "mit and python-2.0",
  "apache-2.0 and mit",
  # Compound licenses for numpy, faiss-cpu, pypdfium2
  "mit and bsd-3-clause",
  "bsd-3-clause and 0bsd and mit and zlib and cc0-1.0",
  "bsd-3-clause, apache-2.0, dependency licenses",
]
unauthorized_licenses = [
  "gpl v3",
]
level = "Paranoid"

[tool.liccheck.authorized_packages]
aiocache = ">=0.12.3"
aiohappyeyeballs = ">=2.4.3"
docutils = "*"
guardrails-api-client = "*"
guardrails-api = "*"
pondpond = ">=1.4.1"
